<svg width="1280" height="220" viewBox="0 0 1280 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tenor+Sans&amp;family=Inter:wght@300;400;700;800&amp;display=swap');
      
      .text-title {
        font-family: 'Lorenza', 'Tenor Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 64px;
        font-weight: 400;
        letter-spacing: -0.5px;
      }
      
      .text-subtitle {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 4px;
      }
    </style>

    <!-- Mesh Gradient Blurring Filter -->
    <filter id="mesh-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="65" />
    </filter>

    <!-- Text Metallic Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Liquid Blob Gradients -->
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    
    <clipPath id="screen-clip">
      <rect width="1280" height="220" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen-clip)">
    <!-- Base Dark Background -->
    <rect width="1280" height="220" fill="#0B0B12"/>

    <!-- Fluid / Liquid Shapes (macOS style) -->
    <g filter="url(#mesh-blur)">
      <ellipse cx="200" cy="50" rx="400" ry="250" fill="url(#blob1)"/>
      <ellipse cx="1000" cy="180" rx="450" ry="300" fill="url(#blob2)"/>
      <ellipse cx="700" cy="-50" rx="350" ry="250" fill="url(#blob3)"/>
      <ellipse cx="1100" cy="20" rx="300" ry="200" fill="#8B5CF6" opacity="0.6"/>
    </g>

    <!-- Frosted Glass Overlay -->
    <rect width="1280" height="220" fill="rgba(15, 15, 20, 0.5)" />

    <!-- Glass Highlights / Borders -->
    <line x1="0" y1="1" x2="1280" y2="1" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
    <line x1="0" y1="219" x2="1280" y2="219" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    <rect width="1280" height="220" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>

    <!-- macOS Window Controls -->
    <g transform="translate(30, 25)">
      <circle cx="0" cy="0" r="7" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/>
      <circle cx="24" cy="0" r="7" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/>
      <circle cx="48" cy="0" r="7" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/>
    </g>

    <!-- Name text -->
    <text 
      class="text-title"
      x="640" y="115"
      text-anchor="middle"
      fill="url(#text-gradient)">
      Subhajit Mondal
    </text>

    <!-- Tagline text -->
    <text 
      class="text-subtitle"
      x="640" y="158"
      text-anchor="middle"
      fill="#F8FAFC"
      opacity="0.85">
      FULL-STACK DEVELOPER  |  AI &amp; WEB APPS  |  JAVA  |  PYTHON  |  REACT
    </text>
  </g>
</svg>
